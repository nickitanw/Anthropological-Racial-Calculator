<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Anthropological Map</title>

<style>
    

html,
body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#1e1e1e;
    font-family:'Georgia','Palatino Linotype','Book Antiqua',serif;
}

#mapWrapper{
    width:100vw;
    height:100vh;
    overflow:hidden;
    position:relative;
    cursor:grab;
}

#mapWrapper.dragging{
    cursor:grabbing;
}

#svgContainer{
    position:absolute;
    left:50%;
    top:50%;
    transform-origin:center center;
    will-change:transform;
}

#svgContainer svg{
    display:block;
    user-select:none;
}

#mapTooltip{
    position:fixed;

    display:none;

    background:rgba(20,20,20,.95);
    color:white;

    padding:8px 12px;

    border-radius:6px;

    font-size:13px;

    pointer-events:none;

    z-index:99999;
}

#legend{
    position:fixed;

    top:10px;
    right:10px;

    background:linear-gradient(
        165deg,
        rgba(252,249,243,.97),
        rgba(242,234,219,.94)
    );

    border:2px solid #b9a788;

    border-radius:10px;

    padding:12px;

    max-height:82vh;
    min-width:280px;

    overflow:hidden;
    display:flex;
    flex-direction:column;
    gap:8px;

    box-shadow:
        0 10px 24px rgba(17,12,5,.28);

    z-index:999;
}

.legend-title{
    font-size:12px;
    font-variant:small-caps;
    letter-spacing:1.2px;
    color:#4d3823;
}

.legend-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    border-bottom:1px solid #c7b79b;
    padding-bottom:6px;
}

.legend-toggle{
    border:1px solid #b9a788;
    background:#efe4d1;
    color:#4d3823;
    font-size:11px;
    line-height:1;
    padding:5px 7px;
    border-radius:6px;
    cursor:pointer;
}

.legend-toggle:hover{
    background:#e7dac2;
}

.legend-top-score{
    background:rgba(224,208,181,.78);
    border:1px solid rgba(140,120,90,.45);
    border-radius:8px;
    padding:7px 8px;
    color:#3b2c1c;
    font-size:11px;
    letter-spacing:.6px;
    text-transform:uppercase;
}

.legend-top-score b{
    font-size:12px;
    letter-spacing:.2px;
    text-transform:none;
}

.legend-content{
    max-height:58vh;
    overflow:auto;
    overscroll-behavior:contain;
}

.legend-content.is-collapsed{
    display:none;
}

.legend-table{
    width:100%;
    border-collapse:separate;
    border-spacing:0;
    font-size:12px;
    color:#2f2416;
}

.legend-table thead th{
    position:sticky;
    top:0;
    z-index:1;
    text-align:left;
    padding:7px 6px;
    background:rgba(224,208,181,.95);
    border-bottom:1px solid #b9a788;
    letter-spacing:.5px;
    font-size:11px;
}

.legend-table tbody td{
    padding:6px;
    border-bottom:1px solid rgba(140,120,90,.2);
    vertical-align:middle;
}

.legend-table tbody tr:nth-child(even){
    background:rgba(255,255,255,.35);
}

.legend-table tbody tr.top-1{
    background:linear-gradient(90deg, rgba(212,175,55,.24), rgba(255,255,255,.1));
}

.legend-table tbody tr.top-2{
    background:linear-gradient(90deg, rgba(192,192,192,.26), rgba(255,255,255,.1));
}

.legend-table tbody tr.top-3{
    background:linear-gradient(90deg, rgba(205,127,50,.24), rgba(255,255,255,.1));
}

.legend-rank{
    width:28px;
    font-weight:bold;
    text-align:center;
    color:#5a422c;
}

.legend-type{
    font-weight:bold;
    letter-spacing:.2px;
}

.legend-score{
    text-align:right;
    font-variant-numeric:tabular-nums;
    font-weight:bold;
    color:#47321f;
}

.legend-swatch{
    width:18px;
}

.legend-swatch-chip{
    width:12px;
    height:12px;
    border-radius:50%;
    border:1px solid rgba(60,40,20,.45);
    display:block;
    margin:auto;
}

.land.top-glow-1{
    stroke:#d4af37 !important;
    stroke-width:2.2px !important;
    stroke-opacity:.95;
    filter:drop-shadow(0 0 3px rgba(212,175,55,.55));
}

.land.top-glow-2{
    stroke:#d5d8df !important;
    stroke-width:2.15px !important;
    stroke-opacity:.92;
    filter:drop-shadow(0 0 2px rgba(213,216,223,.5));
}

.land.top-glow-3{
    stroke:#d79a66 !important;
    stroke-width:2.1px !important;
    stroke-opacity:.9;
    filter:drop-shadow(0 0 2px rgba(215,154,102,.5));
}


#amchartsAttribution{

    position:fixed;

    bottom:10px;
    right:10px;

    background:rgba(255,255,255,.9);

    padding:6px 10px;

    border-radius:6px;

    font-size:12px;

    color:#333;

    z-index:99999;

    box-shadow:
        0 1px 5px rgba(0,0,0,.2);
}

#amchartsAttribution a{

    color:#0066cc;

    text-decoration:none;
}

</style>
</head>

<div id="legend"></div>

<script>

const TYPE_KEYS = [
'caucasion',
'caspian',

'hallstatt',
'eastNordic',
'tronder',

'ladogan',
'eastBaltic',

"northernSlavic",
"centralSlavic",
"ponticSlavic",

'alpine',
'dinaric',

"westernMediterranean",
"centralMediterranean",
"easternMediterranean",
"southernMediterranean",

"levantine",
"iranoAfghan",
"armenoid",

"northAsian",
"centralAsian",
"eastAsian",
"malay",
"amerindian",

'ethiopian',
'subSaharan',

];

let currentScores = {};
let currentColors = {};

let bordersInitialized = false;
let legendCollapsed = false;
let lastTopTypes = [];

const regionCache = {};

window.addEventListener(
    'message',
    event => {

        if(!event.data)
            return;

        currentScores =
            event.data.scores || {};

        currentColors =
            event.data.colors || {};

        paintMap();

    }
);





function createLegend(){

    const legend =
        document.getElementById(
            'legend'
        );

    legend.innerHTML = '';

    const ranked =
        TYPE_KEYS
            .map(type => ({
                type,
                label:
                    TYPE_LABELS[type] ||
                    type,
                score:
                    Math.round(
                        currentScores[type] || 0
                    ),
                color:
                    currentColors[type] || '#888'
            }))
            .sort(
                (a, b) => b.score - a.score
            );

    const tableRows =
        ranked
            .map((item, idx) => `
                <tr class="${idx < 3 ? `top-${idx + 1}` : ''}">
                    <td class="legend-rank">${idx + 1}</td>
                    <td class="legend-swatch">
                        <span
                            class="legend-swatch-chip"
                            style="background:${item.color};">
                        </span>
                    </td>
                    <td class="legend-type">${item.label}</td>
                    <td class="legend-score">${item.score}</td>
                </tr>
            `)
            .join('');

    const topType = ranked[0] || null;
    const topTypeName = topType ? topType.label : 'No Data';
    const topTypeScore = topType ? topType.score : 0;

    legend.innerHTML = `
        <div class="legend-header">
            <div class="legend-title">Type Ranking</div>
            <button
                type="button"
                class="legend-toggle"
                id="legendToggleButton"
                aria-expanded="${legendCollapsed ? 'false' : 'true'}"
                aria-controls="legendRankingSection">
                ${legendCollapsed ? 'Expand' : 'Collapse'}
            </button>
        </div>
        <div class="legend-top-score">
            TYPE SCORE: <b>${topTypeName}</b> (${topTypeScore})
        </div>
        <div id="legendRankingSection" class="legend-content ${legendCollapsed ? 'is-collapsed' : ''}">
            <table class="legend-table">
                <thead>
                    <tr>
                        <th>#</th>
                        <th></th>
                        <th>Type</th>
                        <th style="text-align:right;">Score</th>
                    </tr>
                </thead>
                <tbody>
                    ${tableRows}
                </tbody>
            </table>
        </div>
    `;

    const toggleButton = document.getElementById('legendToggleButton');
    if (toggleButton) {
        toggleButton.onclick = () => {
            legendCollapsed = !legendCollapsed;
            createLegend();
        };
    }

    const legendContent = document.getElementById('legendRankingSection');
    if (legendContent) {
        legendContent.onwheel = event => {
            event.stopPropagation();
        };
    }

    legend.onwheel = event => {
        event.stopPropagation();
    };

}

const TYPE_LABELS = {
    hallstatt: 'Hallstatt',
    eastNordic: 'East Nordic',
    tronder: 'Tronder',
    ladogan: 'Ladogan',
    eastBaltic: 'East Baltic',
    northernSlavic: 'Northern Slavic',
    centralSlavic: 'Central Slavic',
    ponticSlavic: 'Pontic Slavic',
    alpine: 'Alpine',
    dinaric: 'Dinaric',
    westernMediterranean: 'Western Mediterranean',
    centralMediterranean: 'Central Mediterranean',
    easternMediterranean: 'Eastern Mediterranean',
    southernMediterranean: 'Southern Mediterranean',
    levantine: 'Levantine',
    iranoAfghan: 'Irano-Afghan',
    armedoid: 'Armenoid',
    eastAsian: 'East Asian',
    northAsian: 'North Asian',
    centralAsian: 'Central Asian',
    malay: 'Malay',
    ethiopian: 'Ethiopian',
    subSaharan: 'Sub-Saharan',
    amerindian: 'Amerindian',
    caucasion: 'Caucasion',
    caspian: 'Caspian'
};




function setupTooltips(){

    const tooltip =
        document.getElementById(
            'mapTooltip'
        );

    TYPE_KEYS.forEach(type => {

        const region =
            document.getElementById(
                type
            );

        if(!region)
            return;

        region.addEventListener(
            'mousemove',
            e => {

                tooltip.style.display =
                    'block';

                tooltip.style.left =
                    e.clientX + 15 + 'px';

                tooltip.style.top =
                    e.clientY + 15 + 'px';

                tooltip.innerHTML = `
                    <b>${type}</b>
                    <br>
                    Score:
                    ${
                        Math.round(
                            currentScores[type] || 0
                        )
                    }
                `;

            }
        );

        region.addEventListener(
            'mouseleave',
            () => {

                tooltip.style.display =
                    'none';

            }
        );

    });

}



let scale = 1;

let translateX = 0;
let translateY = 0;

let isDragging = false;

let startX = 0;
let startY = 0;

const wrapper =
    document.getElementById(
        'mapWrapper'
    );

const container =
    document.getElementById(
        'svgContainer'
    );

function clampPan(){

    const svg =
        container.querySelector(
            'svg'
        );

    if(!svg)
        return;

    const rect =
        svg.getBoundingClientRect();

    const maxX =
        Math.max(
            0,
            (rect.width -
            wrapper.clientWidth) / 2
        );

    const maxY =
        Math.max(
            0,
            (rect.height -
            wrapper.clientHeight) / 2
        );

    translateX =
        Math.max(
            -maxX,
            Math.min(
                maxX,
                translateX
            )
        );

    translateY =
        Math.max(
            -maxY,
            Math.min(
                maxY,
                translateY
            )
        );

}

function updateTransform(){

    clampPan();

    container.style.transform =
        `
        translate(
            calc(-50% + ${translateX}px),
            calc(-50% + ${translateY}px)
        )
        scale(${scale})
        `;

}

wrapper.addEventListener(
    'wheel',
    e => {

        e.preventDefault();

        if(e.deltaY < 0){

            scale *= 1.1;

        }else{

            scale *= 0.9;

        }

        scale =
            Math.max(
                0.5,
                Math.min(
                    3,
                    scale
                )
            );

        updateTransform();

    },
    {
        passive:false
    }
);

wrapper.addEventListener(
    'pointerdown',
    e => {

        isDragging = true;

        wrapper.classList.add(
            'dragging'
        );

        startX =
            e.clientX -
            translateX;

        startY =
            e.clientY -
            translateY;

    }
);

window.addEventListener(
    'pointermove',
    e => {

        if(!isDragging)
            return;

        translateX =
            e.clientX -
            startX;

        translateY =
            e.clientY -
            startY;

        updateTransform();

    }
);

window.addEventListener(
    'pointerup',
    () => {

        isDragging = false;

        wrapper.classList.remove(
            'dragging'
        );

    }
);

window.addEventListener(
    'load',
    () => {

        setupTooltips();

        createLegend();

        updateTransform();

    }
);





function paintMap(){

    if(!bordersInitialized){

        TYPE_KEYS.forEach(type => {

            const region =
                document.getElementById(type);

            if(!region)
                return;

            regionCache[type] = region;

            const computed =
                window.getComputedStyle(
                    region
                );

            region.dataset.baseStroke =
                computed.stroke;

            region.dataset.baseStrokeWidth =
                computed.strokeWidth;

        });

        bordersInitialized = true;

    }

    const maxScore =
        Math.max(
            ...Object.values(
                currentScores
            ),
            1
        );

    TYPE_KEYS.forEach(type => {

        const region = regionCache[type];

        if(!region)
            return;

        const score =
            currentScores[type] || 0;

        const color =
            currentColors[type] || '#888';

        region.style.fill =
            color;

        region.style.fillOpacity =
            Math.max(
                0.15,
                score / maxScore
            );

        region.style.stroke =
            region.dataset.baseStroke;

        region.style.strokeWidth =
            region.dataset.baseStrokeWidth;

    });

    const rankedTypes =
        TYPE_KEYS
            .map(type => ({
                type,
                score:
                    currentScores[type] || 0
            }))
            .sort(
                (a, b) => b.score - a.score
            );

    const glowClasses = [
        'top-glow-1',
        'top-glow-2',
        'top-glow-3'
    ];

    const topTypes =
        rankedTypes
            .slice(0, 3)
            .map(entry => entry.type);

    const removedTypes =
        lastTopTypes.filter(type => !topTypes.includes(type));

    removedTypes.forEach(type => {

        const region = regionCache[type];

        if(!region)
            return;

        region.classList.remove(
            'top-glow-1',
            'top-glow-2',
            'top-glow-3'
        );

    });

    topTypes.forEach((type, index) => {

        const region = regionCache[type];

        if(!region)
            return;

        region.classList.remove(
            'top-glow-1',
            'top-glow-2',
            'top-glow-3'
        );

        region.classList.add(glowClasses[index]);

    });

    lastTopTypes = topTypes;

    createLegend();

}

</script>
